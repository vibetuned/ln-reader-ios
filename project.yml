# XcodeGen spec — the .xcodeproj is generated, not committed.
# Regenerate after adding/removing files: `xcodegen generate`
name: LnReader
options:
  bundleIdPrefix: com.vibetuned
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  LnReaderCore:
    path: LnReaderCore
  # Official Google Cast XCFramework wrapped for SPM (Google ships no SPM
  # support; this is SRG SSR's maintained wrapper of the unmodified binary).
  GoogleCast:
    url: https://github.com/SRGSSR/google-cast-sdk
    exactVersion: 4.8.4

targets:
  LnReader:
    type: application
    platform: iOS
    sources:
      - LnReader
    dependencies:
      - package: LnReaderCore
      - package: GoogleCast
        product: GoogleCast
    info:
      path: LnReader/Info.plist
      properties:
        # Wire the version/build to the build settings below — XcodeGen writes
        # literals otherwise, and bumps in this file never reach the binary.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # "L&N Reader": App Review 2.3.8 requires the device name to closely
        # match the marketplace name (also "L&N Reader"; plain "LN Reader"
        # was already taken on the App Store).
        CFBundleDisplayName: "L&N Reader"
        # No proprietary encryption (local playback; standard OS networking
        # only) — answers the export-compliance question once, permanently.
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [audio]
        # Google Cast: device discovery + the receiver pulling media from the
        # in-app HTTP server both use the local network.
        NSLocalNetworkUsageDescription: >-
          ln-reader looks for Google Cast devices on your network and streams
          your audiobook to the one you choose.
        NSBonjourServices:
          - _googlecast._tcp
          - _CC1AD845._googlecast._tcp
        # Receive .m4b / .epub via AirDrop and "Open in…" — otherwise iMovie
        # and Books capture them and Save-to-Files is never offered.
        # Not a document-browser app: imports are always copied into the app
        # container (never edited in place), so opening-in-place is off.
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: M4B Audiobook
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.vibetuned.lnreader.m4b
          - CFBundleTypeName: EPUB Book
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.idpf.epub-container
          # Sync manifests are plain .json, so this claims JSON generally —
          # ln-reader shows up in AirDrop/"Open in…" for any JSON file, and
          # the in-app attach sheet lets the user pick the target book.
          - CFBundleTypeName: Sync Manifest
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.json
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.vibetuned.lnreader.m4b
            UTTypeDescription: M4B Audiobook
            UTTypeConformsTo:
              - public.mpeg-4-audio
              - public.audio
            UTTypeTagSpecification:
              public.filename-extension: [m4b]
              public.mime-type: [audio/mp4]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vibetuned.lnreader
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 47D2CT68R2 # Vibetuned
        CURRENT_PROJECT_VERSION: 5
        # Matches the App Store Connect version string ("1.0") — uploads must agree.
        MARKETING_VERSION: "1.1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # Hosted unit tests (WKWebView zoom regression harness — synthetic
  # fixtures generated in code, no book content in the repo).
  LnReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LnReaderTests
    dependencies:
      - target: LnReader
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

  LnReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - LnReaderUITests
    dependencies:
      - target: LnReader
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

schemes:
  LnReader:
    build:
      targets:
        LnReader: all
    test:
      targets:
        - LnReaderTests
        - LnReaderUITests
    run:
      config: Debug
      # DEBUG dev hook — tick one of these in Edit Scheme > Run > Arguments to
      # import a test book on launch (simulator reads host paths directly).
      commandLineArguments:
        '-autoImport "/Users/osf/Documents/books/toaru/A Certain Magical Index - Volume 03.m4b"': false
        '-autoImport "/Users/osf/Documents/books/ascendance/Ascendance of a Bookworm - Part 5 Avatar of a Goddess v12.m4b"': false
